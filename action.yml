name: StubIdP
description: Start a stub OpenID Connect identity provider for testing
author: CerberAuth

branding:
  icon: shield
  color: blue

inputs:
  port:
    description: Port to run stubidp on
    required: false
    default: '8484'
  issuer:
    description: OIDC issuer URL (defaults to http://localhost:<port>)
    required: false
    default: ''
  client-id:
    description: OIDC client ID (auto-generated if not provided)
    required: false
    default: ''
  client-secret:
    description: OIDC client secret (auto-generated if not provided)
    required: false
    default: ''
  redirect-uri:
    description: Allowed redirect URI for the OIDC client
    required: false
    default: ''
  skip-prompt:
    description: Auto-approve login/consent prompts for headless CI
    required: false
    default: 'true'
  default-user:
    description: JSON object of OIDC claims for the stub user
    required: false
    default: ''
  preset:
    description:
      Preconfigure for a specific auth library (better-auth, next-auth)
    required: false
    default: ''
  jwks-file:
    description: Path to a JWKS JSON file (key pair auto-generated if omitted)
    required: false
    default: ''
  log-level:
    description: Log level (fatal, error, warn, info, debug, trace, silent)
    required: false
    default: ''
  rate-limit-disabled:
    description: Disable rate limiting
    required: false
    default: 'true'
  rate-limit-window-ms:
    description:
      Rate limit time window in milliseconds (default 900000 = 15 min)
    required: false
    default: ''
  rate-limit-max:
    description: Max requests per window per IP (default 100)
    required: false
    default: ''
  enable-registration:
    description:
      Enable dynamic client registration (RFC 7591) and management (RFC 7592)
    required: false
    default: ''
  registration-initial-access-token:
    description:
      Bearer token required to register new clients (omit for open registration)
    required: false
    default: ''
  trust-proxy:
    description: Trust reverse proxy headers (X-Forwarded-*)
    required: false
    default: ''
  https-redirect:
    description: Redirect HTTP requests to HTTPS
    required: false
    default: ''
  security-headers:
    description: Enable security headers (CSP, HSTS, etc.) via helmet
    required: false
    default: ''
  post-logout-redirect-uri:
    description: Allowed post-logout redirect URI
    required: false
    default: ''
  public-client:
    description: >-
      Configure as public client (no client_secret,
      token_endpoint_auth_method=none). For SPAs and native apps
    required: false
    default: ''
  version:
    description:
      Version of @cerberauth/stubidp to install (pin for reliable caching)
    required: false
    default: 'latest'

outputs:
  issuer:
    description: OIDC issuer URL (e.g. http://localhost:8484)
  discovery-url:
    description: OIDC discovery URL
  client-id:
    description: OIDC client ID
  client-secret:
    description: OIDC client secret
  port:
    description: Port stubidp is running on

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
