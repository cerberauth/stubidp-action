name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    uses: cerberauth/ci/.github/workflows/action-ci.yml@main

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          port: '8484'
          redirect-uri: 'http://localhost:3000/callback'

      - name: Verify Output
        run: |
          if [ "${{ steps.test-action.outputs.issuer }}" != "http://localhost:8484" ]; then
            echo "Unexpected issuer: ${{ steps.test-action.outputs.issuer }}"
            exit 1
          fi
          if [ "${{ steps.test-action.outputs.discovery-url }}" != "http://localhost:8484/.well-known/openid-configuration" ]; then
            echo "Unexpected discovery-url: ${{ steps.test-action.outputs.discovery-url }}"
            exit 1
          fi
          if [ "${{ steps.test-action.outputs.port }}" != "8484" ]; then
            echo "Unexpected port: ${{ steps.test-action.outputs.port }}"
            exit 1
          fi

      - name: Verify StubIdP is running
        run: |
          curl --fail http://localhost:8484/.well-known/openid-configuration

      - name: Test Public Client with JWT access tokens
        id: test-public
        uses: ./
        with:
          port: '8485'
          redirect-uri: 'http://localhost:3000/callback'
          public-client: 'true'
          access-token-format: jwt
          access-token-ttl: '60'
          enable-registration: 'true'

      - name: Verify Public Client Outputs
        env:
          CLIENT_SECRET: ${{ steps.test-public.outputs.client-secret }}
          TOKEN_ENDPOINT: ${{ steps.test-public.outputs.token-endpoint }}
          REGISTRATION_ENDPOINT:
            ${{ steps.test-public.outputs.registration-endpoint }}
        run: |
          test -z "$CLIENT_SECRET" || { echo "Public client must not have a secret"; exit 1; }
          test "$TOKEN_ENDPOINT" = "http://localhost:8485/token" || { echo "Unexpected token-endpoint: $TOKEN_ENDPOINT"; exit 1; }
          test -n "$REGISTRATION_ENDPOINT" || { echo "Missing registration-endpoint"; exit 1; }
          curl --fail "$REGISTRATION_ENDPOINT" -X POST -H 'Content-Type: application/json' \
            -d '{"redirect_uris":["http://localhost:3000/cb"]}'
